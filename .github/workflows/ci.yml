name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --ignore-scripts : évite le postinstall (prisma migrate deploy) qui exige
        # DATABASE_URL et muterait la prod. Le `prisma generate` explicite ci-dessous suffit.
        run: npm ci --ignore-scripts

      # generate/validate ne se connectent jamais : placeholders suffisent
      # (le schema declare DATABASE_URL + DIRECT_URL ; sans eux → P1012).
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/blocktrust?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/blocktrust?schema=public

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/blocktrust?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/blocktrust?schema=public

      - name: Check DB Schema
        # Mute la prod (ALTER TABLE) : uniquement sur push main, jamais sur les PR.
        if: github.event_name == 'push'
        run: npx tsx scripts/check-prod-db.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # PrismaClient valide tout le bloc datasource (dont directUrl) au init.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_URL: https://blocktrust.tech
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BLOCKTRUST_JWT_PRIVATE_KEY: ${{ secrets.BLOCKTRUST_JWT_PRIVATE_KEY }}
          BLOCKTRUST_JWT_PUBLIC_KEY: ${{ secrets.BLOCKTRUST_JWT_PUBLIC_KEY }}
          POLYGON_RPC_URL: https://polygon-rpc.com
          POLYGON_CHAIN_ID: "137"
          POLYGON_PRIVATE_KEY: ${{ secrets.POLYGON_PRIVATE_KEY }}
          POLYGON_CONTRACT_ADDRESS: "0x000000000000000000000000000000000000dEaD"
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: placeholder
          ADMIN_EMAILS: brnbtech@gmail.com

      - name: Security audit
        run: npm audit --audit-level=critical
