<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLOCKTRUST TrustScan</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div id="extension-status-bar" class="extension-status-bar extension-status-bar--loading" role="status">
        Chargement…
      </div>

      <header class="header">
        <div class="logo">
          <span class="logo-text">BLOCKTRUST™</span>
          <span class="logo-sub">TrustScan</span>
        </div>
      </header>

      <div id="status-msg" class="status-msg hidden" role="status"></div>

      <div id="loading" class="section loading-section" aria-busy="true">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p class="loading-text">Vérification de la connexion…</p>
      </div>

      <div id="not-connected" class="section hidden">
        <p class="text-muted">
          Connectez votre compte BLOCKTRUST pour activer la vérification automatique dans Gmail.
        </p>
        <label class="sr-only" for="api-key-input">Clé API</label>
        <input
          type="password"
          id="api-key-input"
          class="input"
          placeholder="Votre clé API bt_ext_..."
          autocomplete="off"
        />
        <button type="button" id="connect-btn" class="btn-primary">Connecter</button>
        <a
          href="https://blocktrust.tech/dashboard/settings"
          target="_blank"
          rel="noopener noreferrer"
          class="link"
        >
          Obtenir ma clé API →
        </a>
      </div>

      <div id="connected" class="section hidden">
        <div class="status-badge connected" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          Connecté
        </div>
        <div class="info-row">
          <span class="label">Compte</span>
          <span id="user-name" class="value">—</span>
        </div>
        <div class="info-row">
          <span class="label">Plan</span>
          <span id="user-plan" class="value">—</span>
        </div>
        <div class="info-row">
          <span class="label">TrustScore</span>
          <span id="user-score" class="value">—</span>
        </div>
        <div class="info-row">
          <span class="label">Contacts</span>
          <span id="user-contacts" class="value">—</span>
        </div>
        <div class="divider"></div>
        <button type="button" id="disconnect-btn" class="btn-secondary">Déconnecter</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
