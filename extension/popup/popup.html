<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLOCKTRUST TrustScan pour Gmail</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div id="extension-status-bar" class="extension-status-bar extension-status-bar--loading" role="status">
        Chargement…
      </div>

      <header class="header">
        <div class="logo">
          <span class="logo-text">BLOCKTRUST™</span>
          <span class="logo-sub">TrustScan · Gmail</span>
        </div>
      </header>

      <div id="status-msg" class="status-msg hidden" role="status"></div>

      <div id="loading" class="section loading-section" aria-busy="true">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p class="loading-text">Vérification de la connexion…</p>
      </div>

      <div id="not-connected" class="section hidden">
        <p class="text-muted">
          Connectez votre compte BLOCKTRUST pour activer la vérification automatique dans Gmail.
        </p>
        <label class="sr-only" for="api-key-input">Clé API</label>
        <input
          type="password"
          id="api-key-input"
          class="input"
          placeholder="Votre clé API bt_ext_..."
          autocomplete="off"
        />
        <button type="button" id="connect-btn" class="btn-primary">Connecter</button>
        <a
          href="https://blocktrust.tech/dashboard/settings"
          target="_blank"
          rel="noopener noreferrer"
          class="link"
        >
          Obtenir ma clé API →
        </a>
      </div>

      <div id="connected" class="section hidden">
        <div class="status-badge connected" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          Connecté
        </div>
        <div class="info-row">
          <span class="label">Compte</span>
          <span id="user-name" class="value">—</span>
        </div>
        <div class="info-row">
          <span class="label">Plan</span>
          <span id="user-plan" class="value">—</span>
        </div>
        <div class="info-row">
          <span class="label">TrustScore</span>
          <span id="user-score" class="value">—</span>
        </div>
        <div class="info-row">
          <span class="label">Contacts</span>
          <span id="user-contacts" class="value">—</span>
        </div>
        <div class="divider"></div>
        <button type="button" id="disconnect-btn" class="btn-secondary">Déconnecter</button>
      </div>

      <section id="bis-mode-section" class="bis-mode-section" aria-labelledby="bis-mode-heading">
        <h2 id="bis-mode-heading" class="bis-mode-heading">Signature BIS</h2>
        <fieldset class="bis-mode-fieldset">
          <legend class="sr-only">Mode de signature BIS</legend>

          <label class="bis-mode-option">
            <input type="radio" name="bisMode" value="auto" />
            <span class="bis-mode-option-body">
              <span class="bis-mode-option-title">Automatique</span>
              <span class="bis-mode-option-desc">
                Tous mes emails sont signés BLOCKTRUST™. Chaque email envoyé contient
                automatiquement votre signature cryptographique.
              </span>
            </span>
          </label>

          <label class="bis-mode-option">
            <input type="radio" name="bisMode" value="selective" checked />
            <span class="bis-mode-option-body">
              <span class="bis-mode-option-title">Sélectif <span class="bis-mode-default">(défaut)</span></span>
              <span class="bis-mode-option-desc">
                Un bouton BIS apparaît dans le composeur Gmail. Cliquez pour signer
                un email avant de l'envoyer.
              </span>
            </span>
          </label>

          <label class="bis-mode-option">
            <input type="radio" name="bisMode" value="off" />
            <span class="bis-mode-option-body">
              <span class="bis-mode-option-title">Désactivé</span>
              <span class="bis-mode-option-desc">
                L'extension vérifie les emails reçus mais ne signe pas les emails sortants.
              </span>
            </span>
          </label>
        </fieldset>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
