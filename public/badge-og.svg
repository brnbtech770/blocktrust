    <!-- Baseline -->
    <text
      x="100"
      y="132"
      text-anchor="middle"
      fill="#00d4ff"
      opacity="0.7"
      font-family="monospace"
      font-size="4.2"
      font-weight="500"
      letter-spacing="2"
    >VERIFIED · SECURE · ON-CHAIN</text>

    <!-- Wordmark -->
    <text
      x="100"
      y="146"
      text-anchor="middle"
      fill="#BDA76B"
      font-family="monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="3.5"
    >BLOCKTRUST</text>
  </g>
</svg>
